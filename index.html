<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panels Quality Forms</title>

<style>

:root{
--header-bg:#1b2a36;
--page-bg:#f4f4f4;
--button-bg:#3a6ea5;
--button-hover:#2f5b89;
--home-bg:#d32f2f;
--home-hover:#b71c1c;
--guide-bg:#2e7d32;
--guide-hover:#256628;
--modal-bg:rgba(0,0,0,0.72);
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
height:100%;
font-family:Arial, Helvetica, sans-serif;
background:var(--page-bg);
overflow:hidden;
}

body{
display:flex;
flex-direction:column;
}

.header{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
background:var(--header-bg);
color:white;
padding:20px 32px;
min-height:130px;
}

.clock-wrap{
justify-self:start;
line-height:1.1;
}

.clock-date{
font-size:24px;
font-weight:600;
}

.clock-time{
font-size:36px;
font-weight:700;
margin-top:4px;
}

.logo-wrap{
justify-self:center;
}

.logo{
height:100px;
width:auto;
}

.title{
justify-self:end;
font-size:52px;
font-weight:700;
white-space:nowrap;
}

.menu-view{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
padding:30px;
overflow:auto;
}

.subtext{
font-size:28px;
margin-bottom:30px;
}

.button-container{
width:min(1100px,90%);
display:grid;
gap:22px;
}

.menu-button{
width:100%;
min-height:100px;
font-size:38px;
font-weight:700;
border:none;
border-radius:14px;
background:var(--button-bg);
color:white;
cursor:pointer;
}

.menu-button:hover{
background:var(--button-hover);
}

.form-view{
display:none;
flex-direction:column;
flex:1;
padding:16px;
gap:14px;
}

.form-toolbar{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:16px;
flex-wrap:wrap;
}

.toolbar-left,
.toolbar-right{
display:flex;
align-items:center;
gap:12px;
flex-wrap:wrap;
}

.home-button,
.guide-button,
.modal-close{
font-size:24px;
font-weight:700;
padding:14px 22px;
border:none;
border-radius:12px;
color:white;
cursor:pointer;
}

.home-button{
background:var(--home-bg);
}

.home-button:hover{
background:var(--home-hover);
}

.guide-button{
background:var(--guide-bg);
}

.guide-button:hover{
background:var(--guide-hover);
}

.iframe-wrap{
flex:1;
border-radius:12px;
overflow:hidden;
background:white;
position:relative;
}

.form-frame{
width:100%;
height:100%;
border:none;
}

/* Modal */
.modal{
display:none;
position:fixed;
inset:0;
z-index:9999;
background:var(--modal-bg);
padding:20px;
}

.modal.open{
display:flex;
}

.modal-content{
width:100%;
height:100%;
background:white;
border-radius:16px;
overflow:hidden;
display:flex;
flex-direction:column;
box-shadow:0 10px 30px rgba(0,0,0,0.35);
}

.modal-toolbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:16px;
padding:16px 20px;
background:#f2f2f2;
border-bottom:1px solid #d8d8d8;
}

.modal-title{
font-size:30px;
font-weight:700;
color:#222;
}

.modal-close{
background:#ff7a00;
}

.modal-close:hover{
background:#e06600;
}

.modal-frame{
flex:1;
width:100%;
border:none;
background:white;
}

@media (max-width: 1200px){
.title{
font-size:40px;
}
}

@media (max-width: 900px){
.header{
grid-template-columns:1fr;
justify-items:center;
text-align:center;
gap:10px;
padding:16px 20px;
}

.clock-wrap,
.logo-wrap,
.title{
justify-self:center;
}

.title{
font-size:30px;
white-space:normal;
}

.clock-date{
font-size:20px;
}

.clock-time{
font-size:30px;
}

.menu-button{
font-size:30px;
min-height:88px;
}

.home-button,
.guide-button,
.modal-close{
font-size:20px;
padding:12px 18px;
}

.modal-title{
font-size:22px;
}
}

</style>
</head>

<body>

<div class="header">

<div class="clock-wrap">
<div id="clockDate" class="clock-date"></div>
<div id="clockTime" class="clock-time"></div>
</div>

<div class="logo-wrap">
<img src="logo3.png" class="logo" alt="Logo">
</div>

<div class="title">Panels Quality Forms</div>

</div>

<div id="menuView" class="menu-view">

<div class="subtext">Tap the form below to begin:</div>

<div class="button-container">

<button class="menu-button" data-form="https://forms.office.com/Pages/ResponsePage.aspx?Host=Teams&lang=%7Blocale%7D&groupId=%7BgroupId%7D&tid=%7Btid%7D&teamsTheme=%7Btheme%7D&upn=%7Bupn%7D&id=IgJUilauPEGR1SrfPab0L_vA7N9uOiBPqIiXOOKCS49UQlVQTFRCQzdYWDMzRkkxMjdWTjlESUdDNy4u">Panels Fab - Build</button>

<button class="menu-button" data-form="https://forms.office.com/Pages/ResponsePage.aspx?Host=Teams&lang={locale}&groupId={groupId}&tid={tid}&teamsTheme={theme}&upn={upn}&id=IgJUilauPEGR1SrfPab0L_vA7N9uOiBPqIiXOOKCS49UM081UTRPWkYzWTRXSEo3VUdaME5JRldJNy4u">Panels Fab - Build Corners</button>

<button class="menu-button" data-form="https://forms.office.com/Pages/ResponsePage.aspx?Host=Teams&lang={locale}&groupId={groupId}&tid={tid}&teamsTheme={theme}&upn={upn}&id=IgJUilauPEGR1SrfPab0L_vA7N9uOiBPqIiXOOKCS49UNTBQV0pJQ0FHTDUzQ01EQklONEdKVTI5Mi4u">Panels Fab - CNC</button>

<button class="menu-button" data-form="https://forms.zohopublic.com/sequoiaoutdoor1/form/PanelsBuild/formperma/DsANxGcHEdMFUn6xKEgIk3vXzqLdKq7kbSWIperZPVg">TEST</button>

</div>

</div>

<div id="formView" class="form-view">

<div class="form-toolbar">
<div class="toolbar-left">
<button id="homeButton" class="home-button">Return to Menu</button>
</div>

<div class="toolbar-right">
<button class="guide-button" data-guide="https://hwumis.github.io/panelsforms/build-lamination.html">Buildtable Defects: Lamination</button>
<button class="guide-button" data-guide="https://hwumis.github.io/panelsforms/build-appearance.html">Buildtable Defects: Appearance</button>
<button class="guide-button" data-guide="https://hwumis.github.io/panelsforms/build-dimensional.html">Buildtable Defects: Dimensional</button>
<button class="guide-button" data-guide="https://hwumis.github.io/panelsforms/build-gaps.html">Buildtable Defects: Gaps</button>
</div>
</div>

<div class="iframe-wrap">
<iframe id="formFrame" class="form-frame"></iframe>
</div>

</div>

<div id="guideModal" class="modal" aria-hidden="true">
<div class="modal-content">
<div class="modal-toolbar">
<div id="modalTitle" class="modal-title">Defect Guide</div>
<button id="closeGuideButton" class="modal-close">Close Guide</button>
</div>
<iframe id="guideFrame" class="modal-frame" src="about:blank"></iframe>
</div>
</div>

<script>

const menuView = document.getElementById("menuView");
const formView = document.getElementById("formView");
const formFrame = document.getElementById("formFrame");
const homeButton = document.getElementById("homeButton");
const buttons = document.querySelectorAll(".menu-button");
const guideButtons = document.querySelectorAll(".guide-button");
const guideModal = document.getElementById("guideModal");
const guideFrame = document.getElementById("guideFrame");
const closeGuideButton = document.getElementById("closeGuideButton");
const modalTitle = document.getElementById("modalTitle");
const clockDate = document.getElementById("clockDate");
const clockTime = document.getElementById("clockTime");

function showMenu(){
closeGuide();
formFrame.src = "about:blank";
formView.style.display = "none";
menuView.style.display = "flex";
}

function showForm(url){
menuView.style.display = "none";
formView.style.display = "flex";
formFrame.src = url;
}

function openGuide(url, titleText){
guideFrame.src = url;
modalTitle.textContent = titleText;
guideModal.classList.add("open");
guideModal.setAttribute("aria-hidden", "false");
}

function closeGuide(){
guideModal.classList.remove("open");
guideModal.setAttribute("aria-hidden", "true");
guideFrame.src = "about:blank";
}

homeButton.addEventListener("click", showMenu);

buttons.forEach(btn => {
btn.addEventListener("click", () => {
showForm(btn.dataset.form);
});
});

guideButtons.forEach(btn => {
btn.addEventListener("click", () => {
openGuide(btn.dataset.guide, btn.textContent.trim());
});
});

closeGuideButton.addEventListener("click", closeGuide);

guideModal.addEventListener("click", (e) => {
if(e.target === guideModal){
closeGuide();
}
});

document.addEventListener("keydown", (e) => {
if(e.key === "Escape" && guideModal.classList.contains("open")){
closeGuide();
}
});

function formatUSDate(now){
const weekdays = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const weekday = weekdays[now.getDay()];
const month = months[now.getMonth()];
const day = now.getDate();
const year = now.getFullYear();

return `${weekday}, ${month} ${day}, ${year}`;
}

function formatUSTime(now){
let hours = now.getHours();
const minutes = String(now.getMinutes()).padStart(2,"0");
const ampm = hours >= 12 ? "PM" : "AM";

hours = hours % 12;
if(hours === 0){
hours = 12;
}

return `${hours}:${minutes} ${ampm}`;
}

function updateClock(){
const now = new Date();
clockDate.textContent = formatUSDate(now);
clockTime.textContent = formatUSTime(now);
}

updateClock();
setInterval(updateClock, 1000);

showMenu();

</script>

</body>
</html>
