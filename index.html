<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panels Quality Forms</title>

<style>
:root{
  --header-bg:#1b2a36;
  --page-bg:#f4f4f4;
  --button-bg:#3a6ea5;
  --button-hover:#2f5b89;
  --home-bg:#d32f2f;
  --home-hover:#b71c1c;
}

*{box-sizing:border-box;}

html,body{
  margin:0;
  height:100%;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--page-bg);
  overflow:hidden;
}

body{
  display:flex;
  flex-direction:column;
}

/* HEADER */
.header{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  background:var(--header-bg);
  color:white;
  padding:20px 32px;
  gap:20px;
}

.clock-wrap{
  display:flex;
  flex-direction:column;
  justify-self:start;
}

.clock-date{font-size:20px;font-weight:700;}
.clock-time{font-size:32px;font-weight:700;}

.logo-wrap{
  justify-self:center;
  display:flex;
  align-items:center;
  justify-content:center;
}

.header-logo{
  max-height:70px;
  max-width:280px;
}

.title{
  justify-self:end;
  font-size:42px;
  font-weight:700;
}

/* MENU */
.menu-view{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:30px;
}

.button-container{
  width:min(1000px,90%);
  display:grid;
  gap:20px;
}

.menu-button{
  min-height:100px;
  font-size:34px;
  border:none;
  border-radius:14px;
  background:var(--button-bg);
  color:white;
  font-weight:700;
  cursor:pointer;
}

.menu-button:hover{
  background:var(--button-hover);
}

/* FORM VIEW */
.form-view{
  display:none;
  flex-direction:column;
  flex:1;
  padding:0; /* FIXED */
}

.form-toolbar{
  padding:10px 12px 0 12px; /* FIXED */
  margin:0;
}

.home-button{
  background:var(--home-bg);
  color:white;
  padding:12px 18px;
  border:none;
  border-radius:10px;
  font-size:20px;
  font-weight:700;
  cursor:pointer;
}

.home-button:hover{
  background:var(--home-hover);
}

.iframe-wrap{
  flex:1;
  margin-top:8px; /* FIXED */
  border-radius:10px;
  overflow:hidden;
  background:white;
}

.form-frame{
  width:100%;
  height:100%;
  border:none;
}
</style>
</head>

<body>

<div class="header">
  <div class="clock-wrap">
    <div id="clockDate" class="clock-date"></div>
    <div id="clockTime" class="clock-time"></div>
  </div>

  <div class="logo-wrap">
    <img src="logo3.png" class="header-logo">
  </div>

  <div class="title">Panels Quality Forms</div>
</div>

<div id="menuView" class="menu-view">
  <div class="button-container">

    <button class="menu-button" data-form="https://forms.zohopublic.com/sequoiaoutdoor1/form/PanelsBuild/formperma/DsANxGcHEdMFUn6xKEgIk3vXzqLdKq7kbSWIperZPVg">
      Panels Build
    </button>

    <button class="menu-button" data-form="https://forms.zohopublic.com/sequoiaoutdoor1/form/PanelsQualityFormsCornersOrderStart/formperma/vxYk_EDb4LTk8UpPtsIaD2RwPr68PI_-wDm-xS_YgM4">
      Corners Order Start
    </button>

    <button class="menu-button" data-form="https://forms.zohopublic.com/sequoiaoutdoor1/form/PanelsQualityFormsCornersHourly/formperma/kjx24aXaOGZkhWOw__OEkuEfeEJ6YLniqTdvHKZnkwE">
      Corners Hourly
    </button>

    <button class="menu-button" data-form="https://forms.zohopublic.com/sequoiaoutdoor1/form/PanelsQualityFormCNC/formperma/w2DyynzQa9_CzrHmk6vaDaBJiGTUM-aFtHXmiABQzTY">
      CNC
    </button>

  </div>
</div>

<div id="formView" class="form-view">
  <div class="form-toolbar">
    <button id="homeButton" class="home-button">Return to Menu</button>
  </div>

  <div class="iframe-wrap">
    <iframe id="formFrame" class="form-frame"></iframe>
  </div>
</div>

<script>
const buttons = document.querySelectorAll(".menu-button");
const formFrame = document.getElementById("formFrame");
const formView = document.getElementById("formView");
const menuView = document.getElementById("menuView");

buttons.forEach(btn=>{
  btn.addEventListener("click",()=>{
    formFrame.src = btn.dataset.form;
    menuView.style.display = "none";
    formView.style.display = "flex";
  });
});

document.getElementById("homeButton").onclick = ()=>{
  formView.style.display = "none";
  menuView.style.display = "flex";
  formFrame.src = "";
};

/* CLOCK */
function updateClock(){
  const now = new Date();

  document.getElementById("clockDate").textContent =
    now.toLocaleDateString("en-US", {
      timeZone:"America/New_York",
      weekday:"long",
      month:"long",
      day:"numeric",
      year:"numeric"
    });

  document.getElementById("clockTime").textContent =
    now.toLocaleTimeString("en-US", {
      timeZone:"America/New_York",
      hour:"numeric",
      minute:"2-digit",
      second:"2-digit",
      hour12:true
    });
}

updateClock();
setInterval(updateClock,1000);
</script>

</body>
</html>
