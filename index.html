<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panels Quality Forms</title>

<style>

:root{
--header-bg:#1b2a36;
--page-bg:#f4f4f4;
--button-bg:#3a6ea5;
--button-hover:#2f5b89;
--home-bg:#d32f2f;
--home-hover:#b71c1c;
--guide-bg:#2e7d32;
--guide-hover:#256628;
--modal-bg:rgba(0,0,0,0.7);
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
height:100%;
font-family:Arial, Helvetica, sans-serif;
background:var(--page-bg);
overflow:hidden;
}

body{
display:flex;
flex-direction:column;
}

/* HEADER */
.header{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
background:var(--header-bg);
color:white;
padding:20px 32px;
min-height:130px;
}

.clock-wrap{
justify-self:start;
}

.clock-date{
font-size:24px;
}

.clock-time{
font-size:36px;
font-weight:700;
}

.logo{
height:100px;
}

.title{
justify-self:end;
font-size:48px;
font-weight:700;
}

/* MENU */
.menu-view{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
padding:30px;
}

.subtext{
font-size:28px;
margin-bottom:30px;
}

.button-container{
width:min(1100px,90%);
display:grid;
gap:20px;
}

.menu-button{
width:100%;
min-height:100px;
font-size:36px;
font-weight:700;
border:none;
border-radius:14px;
background:var(--button-bg);
color:white;
cursor:pointer;
}

.menu-button:hover{
background:var(--button-hover);
}

/* FORM VIEW */
.form-view{
display:none;
flex-direction:column;
flex:1;
padding:16px;
gap:12px;
}

.form-toolbar{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:12px;
flex-wrap:wrap;
}

.toolbar-right{
display:flex;
gap:10px;
flex-wrap:wrap;
}

/* BUTTONS */
.home-button{
background:var(--home-bg);
color:white;
padding:14px 22px;
border:none;
border-radius:12px;
font-size:22px;
font-weight:700;
}

.home-button:hover{
background:var(--home-hover);
}

.guide-button{
background:var(--guide-bg);
color:white;
padding:12px 18px;
border:none;
border-radius:10px;
font-size:18px;
font-weight:700;
}

.guide-button:hover{
background:var(--guide-hover);
}

/* FORM FRAME */
.iframe-wrap{
flex:1;
border-radius:12px;
overflow:hidden;
background:white;
}

.form-frame{
width:100%;
height:100%;
border:none;
}

/* MODAL */
.modal{
display:none;
position:fixed;
inset:0;
z-index:9999;
background:var(--modal-bg);
padding:20px;
}

.modal.open{
display:flex;
}

.modal-content{
width:100%;
height:100%;
background:white;
border-radius:16px;
display:flex;
flex-direction:column;
overflow:hidden;
}

.modal-toolbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 20px;
background:#f1f1f1;
}

/* 🔶 ORANGE CLOSE BUTTON */
.modal-close{
background:#ff7a00;
color:white;
padding:12px 20px;
border:none;
border-radius:10px;
font-size:18px;
font-weight:700;
}

.modal-close:hover{
background:#e06600;
}

.modal-frame{
flex:1;
width:100%;
border:none;
}

/* RESPONSIVE */
@media (max-width: 900px){
.title{
font-size:30px;
}

.menu-button{
font-size:28px;
}

.guide-button{
font-size:16px;
}
}

</style>
</head>

<body>

<div class="header">
<div class="clock-wrap">
<div id="clockDate" class="clock-date"></div>
<div id="clockTime" class="clock-time"></div>
</div>

<img src="logo3.png" class="logo">

<div class="title">Panels Quality Forms</div>
</div>

<div id="menuView" class="menu-view">

<div class="subtext">Tap the form below to begin:</div>

<div class="button-container">
<button class="menu-button" data-form="https://forms.zohopublic.com/sequoiaoutdoor1/form/PanelsBuild/formperma/DsANxGcHEdMFUn6xKEgIk3vXzqLdKq7kbSWIperZPVg">
Panels Fab - Build
</button>
</div>

</div>

<div id="formView" class="form-view">

<div class="form-toolbar">
<button id="homeButton" class="home-button">Return to Menu</button>

<div class="toolbar-right">

<button class="guide-button" data-guide="https://hwumis.github.io/panelsforms/build-lamination.html">
Buildtable Defects: Lamination
</button>

<button class="guide-button" data-guide="https://hwumis.github.io/panelsforms/build-appearance.html">
Buildtable Defects: Appearance
</button>

<button class="guide-button" data-guide="https://hwumis.github.io/panelsforms/build-dimensional.html">
Buildtable Defects: Dimensional
</button>

<button class="guide-button" data-guide="https://hwumis.github.io/panelsforms/build-gaps.html">
Buildtable Defects: Gaps
</button>

</div>
</div>

<div class="iframe-wrap">
<iframe id="formFrame" class="form-frame"></iframe>
</div>

</div>

<!-- MODAL -->
<div id="guideModal" class="modal">
<div class="modal-content">

<div class="modal-toolbar">
<div style="font-size:22px;font-weight:700;">Defect Guide</div>
<button id="closeGuideButton" class="modal-close">Close Guide</button>
</div>

<iframe id="guideFrame" class="modal-frame"></iframe>

</div>
</div>

<script>

const menuView=document.getElementById("menuView");
const formView=document.getElementById("formView");
const formFrame=document.getElementById("formFrame");
const homeButton=document.getElementById("homeButton");
const buttons=document.querySelectorAll(".menu-button");
const guideButtons=document.querySelectorAll(".guide-button");
const guideModal=document.getElementById("guideModal");
const guideFrame=document.getElementById("guideFrame");
const closeGuideButton=document.getElementById("closeGuideButton");

/* NAVIGATION */
function showMenu(){
formFrame.src="about:blank";
formView.style.display="none";
menuView.style.display="flex";
}

function showForm(url){
menuView.style.display="none";
formView.style.display="flex";
formFrame.src=url;
}

buttons.forEach(btn=>{
btn.addEventListener("click",()=>{
showForm(btn.dataset.form);
});
});

homeButton.addEventListener("click",showMenu);

/* GUIDE MODAL */
guideButtons.forEach(btn=>{
btn.addEventListener("click",()=>{
guideFrame.src = btn.dataset.guide;
guideModal.classList.add("open");
});
});

closeGuideButton.addEventListener("click",()=>{
guideModal.classList.remove("open");
guideFrame.src="about:blank";
});

guideModal.addEventListener("click",(e)=>{
if(e.target===guideModal){
guideModal.classList.remove("open");
guideFrame.src="about:blank";
}
});

/* CLOCK */
function updateClock(){
const now=new Date();
clockDate.textContent=now.toLocaleDateString();
clockTime.textContent=now.toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

/* INIT */
showMenu();

</script>

</body>
</html>
