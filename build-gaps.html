<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buildtable Defects: Gaps</title>

<style>
:root{
  --bg:#f4f4f4;
  --card:#ffffff;
  --text:#1f2933;
  --header:#1b2a36;
  --border:#d9e2ec;
  --overlay-bg:rgba(0,0,0,0.9);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  font-family:Arial, Helvetica, sans-serif;
  color:var(--text);
  height:100%;
  overflow:hidden;
}

body{
  display:flex;
  flex-direction:column;
}

.header{
  background:var(--header);
  color:#fff;
  padding:14px 16px;
  text-align:center;
  flex:0 0 auto;
}

.header h1{
  margin:0;
  font-size:24px;
  line-height:1.2;
}

.container{
  width:min(1100px, 96%);
  margin:12px auto;
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:14px;
  align-content:start;
  overflow:auto;
  padding-bottom:12px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px;
  box-shadow:0 3px 8px rgba(0,0,0,0.08);
}

.thumb-wrap{
  position:relative;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fff;
  border:1px solid var(--border);
  border-radius:10px;
  padding:8px;
  overflow:hidden;
}

.card-title{
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 24px);
  margin:0;
  text-align:center;
  font-size:clamp(16px, 2vw, 18px);
  line-height:1.2;
  font-weight:700;
  color:#1f2933;
  z-index:2;
  pointer-events:none;
  text-shadow:0 1px 2px rgba(255,255,255,0.8);
}

.thumb{
  width:100%;
  max-height:170px;
  object-fit:contain;
  border-radius:8px;
  cursor:pointer;
  display:block;
  padding-top:60px;
}

.overlay{
  position:fixed;
  inset:0;
  background:var(--overlay-bg);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:20px;
}

.overlay.open{
  display:flex;
}

.overlay img{
  max-width:96%;
  max-height:96%;
  object-fit:contain;
}

.overlay-close{
  position:absolute;
  top:18px;
  right:18px;
  background:rgba(255,255,255,0.18);
  color:#fff;
  border:1px solid rgba(255,255,255,0.35);
  border-radius:10px;
  padding:10px 14px;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
}

.overlay-hint{
  position:absolute;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  color:#fff;
  font-size:16px;
  opacity:.85;
  text-align:center;
}

@media (max-width: 700px){
  html,body{
    overflow:auto;
  }

  .container{
    grid-template-columns:1fr;
  }

  .thumb{
    max-height:220px;
    padding-top:68px;
  }

  .card-title{
    font-size:16px;
    line-height:1.2;
  }
}
</style>
</head>
<body>

<div class="header">
  <h1>Buildtable Defects: Gaps</h1>
</div>

<div class="container">

  <div class="card">
    <div class="thumb-wrap">
      <h2 class="card-title">Gap is WITHIN allowance and appears even across width</h2>
      <img class="thumb" src="https://hwumis.github.io/panelsforms/PanelsBuildDefectPics/BuildGapsWithin.jpg" alt="Gap is WITHIN allowance and appears even across width" onclick="openImage(this.src)">
    </div>
  </div>

  <div class="card">
    <div class="thumb-wrap">
      <h2 class="card-title">Gap is too wide-PROFILE ISSUE</h2>
      <img class="thumb" src="https://hwumis.github.io/panelsforms/PanelsBuildDefectPics/BuildGapsTooWide.jpg" alt="Gap is too wide-PROFILE ISSUE" onclick="openImage(this.src)">
    </div>
  </div>

  <div class="card">
    <div class="thumb-wrap">
      <h2 class="card-title">Gap appears uneven across the width-PROFILE ISSUE</h2>
      <img class="thumb" src="https://hwumis.github.io/panelsforms/PanelsBuildDefectPics/BuildGapsUneven.jpg" alt="Gap appears uneven across the width-PROFILE ISSUE" onclick="openImage(this.src)">
    </div>
  </div>

  <div class="card">
    <div class="thumb-wrap">
      <h2 class="card-title">Gap is unacceptable due to a PROCESS ERROR</h2>
      <img class="thumb" src="https://hwumis.github.io/panelsforms/PanelsBuildDefectPics/BuildGapsProcessError.jpg" alt="Gap is unacceptable due to a PROCESS ERROR" onclick="openImage(this.src)">
    </div>
  </div>

</div>

<div id="overlay" class="overlay" onclick="closeImage()">
  <button class="overlay-close" type="button">Close</button>
  <img id="overlayImg" alt="Full size example">
  <div class="overlay-hint">Tap anywhere to close</div>
</div>

<script>
function openImage(src){
  const overlay = document.getElementById("overlay");
  const img = document.getElementById("overlayImg");
  img.src = src;
  overlay.classList.add("open");
}

function closeImage(){
  document.getElementById("overlay").classList.remove("open");
}

document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    closeImage();
  }
});
</script>

</body>
</html>
