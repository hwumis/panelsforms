<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buildtable Appearance Defects: Lamination</title>

<style>
:root{
  --bg:#f4f4f4;
  --card:#ffffff;
  --text:#1f2933;
  --sub:#52606d;
  --header:#1b2a36;
  --border:#d9e2ec;
  --overlay-bg:rgba(0,0,0,0.9);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  font-family:Arial, Helvetica, sans-serif;
  color:var(--text);
}

.header{
  background:var(--header);
  color:#fff;
  padding:20px;
  text-align:center;
}

.header h1{
  margin:0;
  font-size:30px;
}

.container{
  width:min(1200px,95%);
  margin:20px auto;
  display:grid;
  gap:20px;
}

.card{
  background:var(--card);
  border-radius:16px;
  padding:16px;
  box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.card h2{
  margin:0 0 10px;
}

.desc{
  font-size:18px;
  color:var(--sub);
  margin-bottom:12px;
}

/* SMALL IMAGE */
.thumb{
  width:100%;
  max-height:300px;
  object-fit:contain;
  border-radius:10px;
  cursor:pointer;
  background:#fff;
}

/* FULLSCREEN OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  background:var(--overlay-bg);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.overlay.open{
  display:flex;
}

.overlay img{
  max-width:95%;
  max-height:95%;
  object-fit:contain;
}

.overlay::after{
  content:"Tap anywhere to close";
  position:absolute;
  bottom:20px;
  color:white;
  font-size:18px;
  opacity:.8;
}

</style>
</head>

<body>

<div class="header">
  <h1>Lamination Defects</h1>
</div>

<div class="container">

  <div class="card">
    <h2>Example 1</h2>
    <div class="desc">Example 1</div>
    <img class="thumb" src="https://hwumis.github.io/panelsforms/bigpic.png" onclick="openImage(this.src)">
  </div>

  <div class="card">
    <h2>Example 2</h2>
    <div class="desc">Example 2</div>
    <img class="thumb" src="https://hwumis.github.io/panelsforms/bigpic2.png" onclick="openImage(this.src)">
  </div>

</div>

<!-- FULLSCREEN IMAGE -->
<div id="overlay" class="overlay" onclick="closeImage()">
  <img id="overlayImg">
</div>

<script>

function openImage(src){
  const overlay = document.getElementById("overlay");
  const img = document.getElementById("overlayImg");

  img.src = src;
  overlay.classList.add("open");
}

function closeImage(){
  document.getElementById("overlay").classList.remove("open");
}

</script>

</body>
</html>
